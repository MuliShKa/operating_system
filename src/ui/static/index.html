<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Songdo Edge Intelligence</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f7fa;
            color: #172033;
        }

        h1 {
            margin-bottom: 8px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f0f3f8;
        }

        .unknown {
            color: #64748b;
        }
    </style>
</head>

<body>
    <h1>Songdo Edge Intelligence</h1>
    <p>Smart Sluice Gate — System Monitoring</p>

    <section class="card">
        <h2>Process Health</h2>

        <p class="unknown">
            Prototype: live process monitoring is not connected yet.
        </p>

        <table>
            <thead>
                <tr>
                    <th>Process</th>
                    <th>PID</th>
                    <th>CPU</th>
                    <th>Memory</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>SensorGen</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>Unknown</td>
                </tr>

                <tr>
                    <td>Processor</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>Unknown</td>
                </tr>

                <tr>
                    <td>HealthMon</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>Unknown</td>
                </tr>

                <tr>
                    <td>API</td>
                    <td>—</td>
                    <td>—</td>
                    <td>—</td>
                    <td>Unknown</td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
