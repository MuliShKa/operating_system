# OS1 Smart Building Edge Gateway (Songdo Convensia).
# Values from the handbook, section 3.1. The node reads them at startup.
name: EDGE_NODE_OS1_CONVENSIA
latitude: 37.3888
longitude: 126.6534

# Simulated indoor sensors: uniform random between min and max.
sensors:
  - {id: INDOOR_CO2_PPM, unit: ppm, min: 600, max: 1400}
  - {id: ROOM_TEMP_C, unit: "°C", min: 19, max: 28}

# OS1-3: if CO2 is above 1000 ppm, open the HVAC damper to 100 %.
# The command expires 15.0 s after the reading (monotonic clock).
rule:
  sensor: INDOOR_CO2_PPM
  above: 1000
  action: HVAC_DAMPER_PCT
  value: 100
  ttl_s: 15.0

# OS1-1: cached VWorld building inventory (read once at startup, no network).
# The node uses `cache` if it exists, otherwise the labelled fixture.
inventory:
  cache: sources/vworld/os1_convensia_buildings.geojson
  fixture: sources/vworld/os1_convensia_buildings.fixture.geojson
  # Optional: VWorld 2D data API layer ID for buildings, only for edge.vworld_fetch.
  # Not used for the submission (no VWorld key, see README). Unverified if set.
  vworld_layer: null
  # Search box around the node for the download, in degrees.
  fetch_radius_deg: 0.003

# OS1-4: /proc sampling period written to process_health.
sample_period_s: 2.0

queue_size: 500
